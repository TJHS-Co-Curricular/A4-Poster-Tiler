; ============================================================
;  A4 拼贴海报 —— 设置文件
;  用记事本打开，改完保存，关掉黑色窗口再重新打开程序就生效。
;  以分号 ; 开头的行是说明，不会被读取。
;  exe 版：放在 exe 旁边的 config\config.ini 会优先采用（不用重新打包）。
; ============================================================

[server]
; 谁可以打开网站：
;   local = 只有这台电脑（最安全，平常用这个）
;   lan   = 同一个网络的同事也可以用 http://这台电脑的IP:端口 打开
access = local

; 网站端口（1024 ~ 65535）
port = 5030

; 端口被别的程序占用时：yes = 自动改用下一个；no = 停止并提示
port_fallback = yes

; 启动时自动打开浏览器：yes / no
open_browser = yes

; 用什么打开：
;   yes = 独立窗口（Edge 或 Chrome 的应用模式，没有网址栏，像一般软件；关掉窗口 = 结束程序）
;   no  = 用默认浏览器开一个分页
; 电脑没有 Edge 也没有 Chrome 时，自动改用默认浏览器
app_window = yes

; access = lan 时，同事可不可以把 PDF 保存到这台电脑的 output 文件夹：
;   no  = 不可以，同事导出的 PDF 会直接下载到同事自己的电脑（建议）
;   yes = 可以
lan_allow_edit = no

[paths]
; 导出的 PDF 放在哪里。相对路径 = 相对于 exe 所在文件夹；也可以写完整路径，例：D:\海报\output
output_folder = output

[log]
; 日志详细程度：debug / info / warning / error
level = info

; 日志保留几天（logs 文件夹里，每天一个文件）；0 = 不删除
keep_days = 30

[tile]
; 每张纸四周的白边（mm）：打印机印不到的地方，剪裁线和编号画在这里。
; 打印出来海报边缘被切掉时，把这个数字改大（例：10）。可填 3 ~ 30，默认 8
margin_mm = 8

; 「重叠粘贴」时相邻两张重叠多少（mm）。可填 3 ~ 50，默认 10
overlap_mm = 10
